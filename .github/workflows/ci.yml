name: CI

on:
  push:
    branches: [main]
  pull_request:

# The engine's test suite is fully offline and deterministic (no network
# fixtures, no external hosts), so CI is a genuine quality gate: a green
# run means the build, the strict type-check, the lint, and all tests
# pass on the pushed commit.
jobs:
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20.19.0
          - os: ubuntu-latest
            node: 22.x
          - os: ubuntu-latest
            node: 24.x
          # The README claims cross-platform support; only a real second
          # and third OS can back that claim (path handling, the CLI,
          # and QuickJS/Wasm all behave subtly differently).
          - os: windows-latest
            node: 22.x
          - os: macos-latest
            node: 22.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  package:
    name: package (exports map is consumable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      # Guards the package.json `exports` map: a consumer importing the
      # published entry point must work, and the internal modules must
      # stay importable through their declared subpaths.
      - name: Import the public entry point
        run: |
          node --input-type=module -e "
            import * as engine from './dist/src/index.js';
            const names = Object.keys(engine).sort();
            for (const required of ['PluginManager','PluginRuntime','PluginLoader','validateManifest','normalizeSourceResults','HttpClient','ENGINE_API_VERSION']) {
              if (!names.includes(required)) throw new Error('missing export: ' + required);
            }
            console.log('public surface OK:', names.length, 'exports');
          "
